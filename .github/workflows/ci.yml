name: ShiftSync Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-and-nlp-tests:
    name: Django REST API, PostgreSQL & NLP Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shiftsync_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install django djangorestframework djangorestframework-simplejwt django-cors-headers django-filter drf-spectacular "psycopg[binary]" python-dotenv pytest pytest-django scikit-learn pandas numpy joblib transformers

      - name: Run database migrations and seed verification
        working-directory: backend
        env:
          POSTGRES_DB: shiftsync_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
        run: |
          python manage.py migrate
          python manage.py seed_demo_data

      - name: Execute Backend & NLP pytest suite
        working-directory: backend
        env:
          POSTGRES_DB: shiftsync_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
        run: |
          pytest -v

  frontend-and-e2e-tests:
    name: React Frontend Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit & Security Tests
        working-directory: frontend
        run: npm run test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build
